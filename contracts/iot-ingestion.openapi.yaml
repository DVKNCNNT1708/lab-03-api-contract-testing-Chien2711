openapi: 3.1.0
info:
  title: B5 - IoT Ingestion API
  version: 1.0.0
  description: Contract for IoT device data ingestion (Lab 03).
  contact:
    name: Nhom B5
    email: b5@example.edu.vn
servers:
  - url: http://localhost:4010
    description: Prism Mock Server
tags:
  - name: health
    description: Health check endpoints
  - name: readings
    description: IoT sensor readings management
paths:
  /health:
    get:
      tags:
        - health
      summary: Check health
      description: Endpoint to check if the service is alive.
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readings:
    post:
      tags:
        - readings
      summary: Create a reading
      description: Accept sensor reading from IoT devices.
      operationId: createReading
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingPayload'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /readings/latest:
    get:
      tags:
        - readings
      summary: List latest readings
      description: Get the most recent readings with limits.
      operationId: getLatestReadings
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of readings to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: device_id
          in: query
          description: Filter by specific device ID
          required: false
          schema:
            type: string
            pattern: '^[a-zA-Z0-9-]+$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReadingResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
      example:
        status: "ok"
        service: "IoT Ingestion Service"
    ReadingPayload:
      type: object
      required:
        - device_id
        - metric
        - value
      properties:
        device_id:
          type: string
        metric:
          type: string
          enum:
            - temperature
            - humidity
            - motion
            - smoke
        value:
          type: number
      example:
        device_id: "ESP32-LAB-A01"
        metric: "temperature"
        value: 25.5
    ReadingResponse:
      type: object
      properties:
        reading_id:
          type: string
          format: uuid
        status:
          type: string
        accepted:
          type: boolean
        device_id:
          type: string
        metric:
          type: string
      example:
        reading_id: "123e4567-e89b-12d3-a456-426614174000"
        status: "accepted"
        accepted: true
        device_id: "ESP32-LAB-A01"
        metric: "temperature"
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
      example:
        type: "https://example.com/probs/bad-request"
        title: "Bad Request"
        status: 400
        detail: "Invalid input"
        instance: "https://example.com/errors/123"
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: Unprocessable Entity (Validation Error)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'