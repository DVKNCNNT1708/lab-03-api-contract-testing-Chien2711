openapi: 3.1.0
info:
  title: AI Vision API
  version: 1.0.0
  description: API for AI Vision
  contact:
    name: Nhom B5
    email: b5@example.edu.vn
tags:
  - name: detection
    description: Các API liên quan đến nhận diện hình ảnh
paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [detection]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
              example:
                status: "ok"
  /detect:
    post:
      tags: [detection]
      summary: Detect objects in image
      description: Phân tích hình ảnh và trả về các đối tượng nhận diện được.
      operationId: detectObjects
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                image_url: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  detection_id: { type: string }
                  label: { type: string }
                  confidence: { type: number }